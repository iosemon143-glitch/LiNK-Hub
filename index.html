<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiNK Hub - Viral Collection</title>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-orange: #ff6600;
            --orange-gradient: linear-gradient(135deg, #ff7a18 0%, #ff5200 100%);
            --bg-body: #0b0f19;
            --card-bg: #131b2e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --radius-card: 28px;
            --radius-pill: 50px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 440px;
            border-radius: var(--radius-card);
            padding: 28px 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            position: relative;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 26px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 18px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-box {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #1e293b;
            border: 2px solid #ff6600;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.3);
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-text h2 {
            font-size: 1.35rem;
            color: var(--text-main);
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .brand-text p {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-top: 2px;
        }

        .status-badge {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .label-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
        }

        .input-pill-wrapper {
            background: #0b0f19;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-pill);
            padding: 4px 6px;
            display: flex;
            align-items: center;
            transition: all 0.25s ease;
        }

        .input-pill-wrapper:focus-within {
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 4px rgba(255, 102, 0, 0.15);
        }

        .input-icon-inside {
            color: var(--primary-orange);
            font-size: 1rem;
            margin-left: 12px;
            margin-right: 6px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: none;
            outline: none;
            font-size: 0.92rem;
            background: transparent;
            color: var(--text-main);
            font-weight: 500;
        }

        input::placeholder {
            color: #475569;
        }

        .btn-action {
            background: var(--orange-gradient);
            color: white;
            border: none;
            padding: 0 18px;
            height: 40px;
            border-radius: var(--radius-pill);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: transform 0.15s, opacity 0.2s;
            box-shadow: 0 4px 12px rgba(255, 102, 0, 0.3);
        }

        .btn-action:active {
            transform: scale(0.96);
        }

        .btn-add-light {
            background: rgba(255, 102, 0, 0.1);
            color: var(--primary-orange);
            border: 1px solid rgba(255, 102, 0, 0.2);
            padding: 5px 12px;
            border-radius: var(--radius-pill);
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-add-light:hover {
            background: rgba(255, 102, 0, 0.2);
        }

        .btn-publish {
            width: 100%;
            background: var(--orange-gradient);
            color: white;
            border: none;
            padding: 15px;
            border-radius: var(--radius-pill);
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 102, 0, 0.4);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.25s ease;
        }

        .btn-publish:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(255, 102, 0, 0.6);
        }

        .dynamic-field {
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Header -->
        <div class="header">
            <div class="brand">
                <div class="logo-box">
                    <img src="https://archive.org/download/20261031-043559/20261031_043559.png" alt="Logo" onerror="this.style.display='none';">
                </div>
                <div class="brand-text">
                    <h2>LiNK Hub</h2>
                    <p>Viral Collection Admin</p>
                </div>
            </div>
            <!-- Status Badge -->
            <div class="status-badge">
                <i class="fa-solid fa-circle-check"></i> Connected
            </div>
        </div>

        <!-- Form -->
        <form id="postForm" onsubmit="handlePublish(event)">
            
            <!-- Post Title with Label Button -->
            <div class="form-group">
                <label><i class="fa-solid fa-heading"></i> Post Title</label>
                <div class="input-pill-wrapper">
                    <input type="text" id="postTitle" placeholder="Enter post title..." required>
                    <button type="button" class="btn-action" onclick="promptLabel()" style="margin-right: 2px;">
                        <i class="fa-solid fa-tags"></i> Label
                    </button>
                </div>
                <input type="hidden" id="postLabel" value="Trending Link">
            </div>

            <!-- Post Image -->
            <div class="form-group">
                <label><i class="fa-regular fa-image"></i> Post Image</label>
                <div class="input-pill-wrapper">
                    <i class="fa-solid fa-link input-icon-inside"></i>
                    <input type="text" id="thumbnailUrl" placeholder="Paste direct image URL...">
                </div>
            </div>

            <!-- Photos -->
            <div class="form-group">
                <div class="label-container">
                    <label><i class="fa-regular fa-images"></i> Photos</label>
                    <button type="button" class="btn-add-light" onclick="addNewField('additionalPhotosContainer', 'photo')">+ Add Photo</button>
                </div>
                <div id="additionalPhotosContainer">
                    <div class="input-pill-wrapper dynamic-field">
                        <i class="fa-regular fa-image input-icon-inside"></i>
                        <input type="text" class="additional-photo-input" placeholder="Paste extra photo URL...">
                    </div>
                </div>
            </div>

            <!-- Video -->
            <div class="form-group">
                <div class="label-container">
                    <label><i class="fa-solid fa-video"></i> Video</label>
                    <button type="button" class="btn-add-light" onclick="addNewField('videoStreamsContainer', 'video')">+ Add Video</button>
                </div>
                <div id="videoStreamsContainer">
                    <div class="input-pill-wrapper dynamic-field">
                        <i class="fa-solid fa-video input-icon-inside"></i>
                        <input type="text" class="video-stream-input" placeholder="Paste video direct URL...">
                    </div>
                </div>
            </div>

            <!-- Publish Button -->
            <button type="submit" class="btn-publish" id="publishBtn">
                Publish to LiNK Hub <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </div>

    <!-- JavaScript Backend API Execution -->
    <script>
        const BLOG_ID = "4933392428309988074";
        const ACCESS_TOKEN = "ya29.a0AehfTOnho0XLojy0AL_INxxNKga-P_2S9e-v6gHCfENwAZWBGkcJWd6uZ6j-mVHxUr4vz9m4U3n0mOoa9mEXRfKIW7egxTakTW-1VL0NSdhEgjHMw1G3ymC8bYyYoRlquFNwxXKUTXjpt_EtvntstNUecI7PtRH_UBgbKRF5QuC9R1GeK31f6IjyRg6W6lzXLg5LhrEaCgYKAVcSARESFQHGX2Mip6RcAOjZUebS6FuxCG3fSw0206";

        function promptLabel() {
            const currentLabel = document.getElementById('postLabel').value;
            const newLabel = prompt("পোস্টের জন্য লেবেল বা ক্যাটাগরি লিখুন:", currentLabel);
            if(newLabel !== null && newLabel.trim() !== "") {
                document.getElementById('postLabel').value = newLabel.trim();
                alert("লেবেল সফলভাবে সেট হয়েছে: " + newLabel);
            }
        }

        function addNewField(containerWrapperId, fieldCategory) {
            const containerBox = document.getElementById(containerWrapperId);
            const wrapperDiv = document.createElement('div');
            wrapperDiv.className = 'input-pill-wrapper dynamic-field';
            
            const iconClass = fieldCategory === 'photo' ? 'fa-regular fa-image' : 'fa-solid fa-video';
            const inputPlaceholderText = fieldCategory === 'photo' ? 'Paste extra photo URL...' : 'Paste video direct URL...';
            const specificInputClassName = fieldCategory === 'photo' ? 'additional-photo-input' : 'video-stream-input';

            wrapperDiv.innerHTML = `
                <i class="${iconClass} input-icon-inside"></i>
                <input type="text" class="${specificInputClassName}" placeholder="${inputPlaceholderText}">
            `;
            containerBox.appendChild(wrapperDiv);
        }

        async function handlePublish(submissionEvent) {
            submissionEvent.preventDefault();

            const postTitleText = document.getElementById('postTitle').value.trim();
            const postLabelText = document.getElementById('postLabel').value.trim() || "Trending Link";
            const thumbnailSource = document.getElementById('thumbnailUrl').value.trim();

            const extraPhotoInputsList = document.querySelectorAll('.additional-photo-input');
            let collectedPhotosHtmlCode = '';
            extraPhotoInputsList.forEach(function(field) {
                if (field.value.trim() !== '') {
                    collectedPhotosHtmlCode += `<div style="margin-bottom:15px;"><img src="${field.value.trim()}" alt="Photo" style="width:100%; border-radius:18px; object-fit:cover;"/></div>`;
                }
            });

            const extraVideoInputsList = document.querySelectorAll('.video-stream-input');
            let collectedVideosHtmlCode = '';
            extraVideoInputsList.forEach(function(field) {
                if (field.value.trim() !== '') {
                    collectedVideosHtmlCode += `<div style="margin-bottom:15px;"><video controls style="width:100%; border-radius:18px;"><source src="${field.value.trim()}" type="video/mp4"></video></div>`;
                }
            });

            const finalPostContentHtml = `
                <div class="viral-post-container" style="background:#1a1025; padding:20px; border-radius:24px; color:#fff; max-width:400px; margin:auto; box-shadow:0 10px 30px rgba(0,0,0,0.5);">
                    <h2 style="text-align:center; margin-bottom:15px; font-size:1.3rem; color:#fff;">${postTitleText}</h2>
                    ${thumbnailSource ? `<div style="margin-bottom:15px; position:relative;"><img src="${thumbnailSource}" alt="Thumbnail" style="width:100%; border-radius:18px; object-fit:cover;"/><div style="position:absolute; bottom:10px; left:10px; background:#ff2a75; padding:4px 12px; border-radius:20px; font-size:0.75rem; font-weight:bold;">${postLabelText}</div></div>` : ''}
                    ${collectedPhotosHtmlCode}
                    ${collectedVideosHtmlCode}
                </div>
            `;

            const publishButtonElement = document.getElementById('publishBtn');
            publishButtonElement.disabled = true;
            publishButtonElement.innerHTML = `Publishing... <i class="fa-solid fa-spinner fa-spin"></i>`;

            try {
                const response = await fetch(`https://www.googleapis.com/blogger/v3/blogs/${BLOG_ID}/posts/`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${ACCESS_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: postTitleText,
                        content: finalPostContentHtml,
                        labels: [postLabelText]
                    })
                });

                const responseJsonData = await response.json();

                if (responseJsonData.id) {
                    alert("অভিনন্দন! সফলভাবে আপনার LiNK Hub সাইটে পোস্ট পাবলিশ হয়েছে! 🎉");
                    document.getElementById('postForm').reset();
                } else {
                    alert("পোস্ট পাবলিশ করতে সমস্যা হয়েছে: " + (responseJsonData.error?.message || "দয়া করে সঠিক ডিরেক্ট URL ব্যবহার করুন।"));
                }
            } catch (networkError) {
                alert("নেটওয়ার্ক সংযোগে সমস্যা হয়েছে!");
            } finally {
                publishButtonElement.disabled = false;
                publishButtonElement.innerHTML = `Publish to LiNK Hub <i class="fa-solid fa-paper-plane"></i>`;
            }
        }
    </script>
</body>
</html>
