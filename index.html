<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiNK Hub - Viral Collection</title>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-orange: #ff5500;
            --orange-gradient: linear-gradient(135deg, #ff7a18 0%, #ff4500 100%);
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-card: 28px;
            --radius-pill: 50px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 440px;
            border-radius: var(--radius-card);
            padding: 28px 24px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 26px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-box {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid var(--primary-orange);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(255, 85, 0, 0.2);
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-text h2 {
            font-size: 1.35rem;
            color: var(--text-main);
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .brand-text p {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-top: 2px;
        }

        .top-icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 85, 0, 0.1);
            color: var(--primary-orange);
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .label-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
        }

        .btn-add-light {
            background: rgba(255, 85, 0, 0.08);
            color: var(--primary-orange);
            border: none;
            padding: 4px 10px;
            border-radius: var(--radius-pill);
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-add-light:hover {
            background: rgba(255, 85, 0, 0.15);
        }

        .input-pill-wrapper {
            background: #ffffff;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-pill);
            padding: 4px 6px 4px 14px;
            display: flex;
            align-items: center;
            transition: all 0.25s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .input-pill-wrapper:focus-within {
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 4px rgba(255, 85, 0, 0.1);
        }

        input[type="text"] {
            width: 100%;
            padding: 8px 4px;
            border: none;
            outline: none;
            font-size: 0.9rem;
            background: transparent;
            color: var(--text-main);
            font-weight: 500;
        }

        input::placeholder {
            color: #94a3b8;
        }

        .file-input-hidden {
            display: none;
        }

        .btn-browse {
            background: var(--orange-gradient);
            color: white;
            border: none;
            padding: 0 16px;
            height: 38px;
            border-radius: var(--radius-pill);
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(255, 85, 0, 0.25);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-publish {
            width: 100%;
            background: var(--orange-gradient);
            color: white;
            border: none;
            padding: 15px;
            border-radius: var(--radius-pill);
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(255, 85, 0, 0.35);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.25s ease;
        }

        .btn-publish:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(255, 85, 0, 0.45);
        }

        .dynamic-field {
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Header -->
        <div class="header">
            <div class="brand">
                <div class="logo-box">
                    <img src="https://archive.org/download/20261031-043559/20261031_043559.png" alt="Logo" onerror="this.style.display='none';">
                </div>
                <div class="brand-text">
                    <h2>LiNK Hub</h2>
                    <p>Viral Collection</p>
                </div>
            </div>
            <button class="top-icon-btn"><i class="fa-solid fa-bullseye"></i></button>
        </div>

        <!-- Form -->
        <form id="postForm" onsubmit="handlePublish(event)">
            
            <!-- Post Title -->
            <div class="form-group">
                <label><i class="fa-solid fa-pen" style="color:var(--primary-orange);"></i> Post Title</label>
                <div class="input-pill-wrapper" style="padding-right: 6px;">
                    <input type="text" id="postTitle" placeholder="Enter post title..." required>
                    <button type="button" class="btn-browse" onclick="promptLabel()">
                        <i class="fa-solid fa-tags"></i> Label
                    </button>
                </div>
                <input type="hidden" id="postLabel" value="Trending Link">
            </div>

            <!-- Post Image (Thumbnail) -->
            <div class="form-group">
                <label><i class="fa-regular fa-image" style="color:var(--primary-orange);"></i> Post Image</label>
                <div class="input-pill-wrapper">
                    <input type="text" id="thumbnailUrl" placeholder="Select image or paste link..." required>
                    <input type="file" id="thumbFile" class="file-input-hidden" accept="image/*" onchange="handleLocalFile(this, 'thumbnailUrl')">
                    <button type="button" class="btn-browse" onclick="document.getElementById('thumbFile').click()">
                        <i class="fa-solid fa-folder-open"></i> Browse
                    </button>
                </div>
            </div>

            <!-- Photos -->
            <div class="form-group">
                <div class="label-container">
                    <label><i class="fa-regular fa-images" style="color:var(--primary-orange);"></i> Photos</label>
                    <button type="button" class="btn-add-light" onclick="addNewPhotoField()">+ Add Photo</button>
                </div>
                <div id="additionalPhotosContainer">
                    <div class="input-pill-wrapper dynamic-field">
                        <input type="text" class="additional-photo-input" placeholder="Select photo or paste link...">
                        <input type="file" class="file-input-hidden extra-photo-file" accept="image/*" onchange="handleLocalFileDynamic(this, 'photo')">
                        <button type="button" class="btn-browse" onclick="triggerFile(this)">
                            <i class="fa-solid fa-folder-open"></i> Browse
                        </button>
                    </div>
                </div>
            </div>

            <!-- Video -->
            <div class="form-group">
                <div class="label-container">
                    <label><i class="fa-solid fa-video" style="color:var(--primary-orange);"></i> Video</label>
                    <button type="button" class="btn-add-light" onclick="addNewVideoField()">+ Add Video</button>
                </div>
                <div id="videoStreamsContainer">
                    <div class="input-pill-wrapper dynamic-field">
                        <input type="text" class="video-stream-input" placeholder="Select video or paste link...[span_3](start_span)"[span_3](end_span)>
                        <input type="file" class="file-input-hidden extra-video-file" accept="video/*" onchange="handleLocalFileDynamic(this, 'video')">
                        <button type="button" class="btn-browse" onclick="triggerFile(this)">
                            <i class="fa-solid fa-folder-open"></i> Browse
                        </button>
                    </div>
                </div>
            </div>

            <!-- Publish Button -->
            <button type="submit" class="btn-publish" id="publishBtn">
                Publish to LiNK Hub <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const BLOGGER_EMAIL = "ios.emon143.LiNKHub@blogger.com";

        function promptLabel() {
            const currentLabel = document.getElementById('postLabel').value;
            const newLabel = prompt("পোস্টের জন্য লেবেল বা ক্যাটাগরি লিখুন:", currentLabel);
            if(newLabel !== null && newLabel.trim() !== "") {
                document.getElementById('postLabel').value = newLabel.trim();
                alert("লেবেল সেট হয়েছে: " + newLabel);
            }
        }

        function triggerFile(btn) {
            const wrapper = btn.closest('.input-pill-wrapper');
            const fileInput = wrapper.querySelector('input[type="file"]');
            fileInput.click();
        }

        // Local file reader (No network failure, instant load)
        function handleLocalFile(fileInput, targetId) {
            const file = fileInput.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById(targetId).value = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function handleLocalFileDynamic(fileInput, type) {
            const file = fileInput.files[0];
            if (!file) return;
            const wrapper = fileInput.files ? fileInput.closest('.input-pill-wrapper') : null;
            if(!wrapper) return;
            const textInput = wrapper.querySelector(type === 'photo' ? '.additional-photo-input' : '.video-stream-input');
            const reader = new FileReader();
            reader.onload = function(e) {
                textInput.value = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function addNewPhotoField() {
            const container = document.getElementById('additionalPhotosContainer');
            const div = document.createElement('div');
            div.className = 'input-pill-wrapper dynamic-field';
            div.innerHTML = `
                <input type="text" class="additional-photo-input" placeholder="Select photo or paste link...">
                <input type="file" class="file-input-hidden extra-photo-file" accept="image/*" onchange="handleLocalFileDynamic(this, 'photo')">
                <button type="button" class="btn-browse" onclick="triggerFile(this)">
                    <i class="fa-solid fa-folder-open"></i> Browse
                </button>
            `;
            container.appendChild(div);
        }

        function addNewVideoField() {
            const container = document.getElementById('videoStreamsContainer');
            const div = document.createElement('div');
            div.className = 'input-pill-wrapper dynamic-field';
            div.innerHTML = `
                <input type="text" class="video-stream-input" placeholder="Select video or paste link...[span_4](start_span)"[span_4](end_span)>
                <input type="file" class="file-input-hidden extra-video-file" accept="video/*" onchange="handleLocalFileDynamic(this, 'video')">
                <button type="button" class="btn-browse" onclick="triggerFile(this)">
                    <i class="fa-solid fa-folder-open"></i> Browse
                </button>
            `;
            container.appendChild(div);
        }

        function handlePublish(e) {
            e.preventDefault();
            const title = document.getElementById('postTitle').value.trim();
            const label = document.getElementById('postLabel').value.trim() || "Trending Link";
            const thumb = document.getElementById('thumbnailUrl').value.trim();

            let photosHtml = '';
            document.querySelectorAll('.additional-photo-input').forEach(input => {
                if (input.value.trim()) {
                    photosHtml += `<div style="margin-bottom:15px;"><img src="${input.value.trim()}" alt="Photo" style="width:100%; border-radius:18px; object-fit:cover;"/></div>`;
                }
            });

            let videosHtml = '';
            document.querySelectorAll('.video-stream-input').forEach(input => {
                if (input.value.trim()) {
                    videosHtml += `<div style="margin-bottom:15px;"><video controls style="width:100%; border-radius:18px;"><source src="${input.value.trim()}" type="video/mp4"></video></div>`;
                }
            });

            const htmlContent = `
                <div class="viral-post-container" style="background:#1a1025; padding:20px; border-radius:24px; color:#fff; max-width:400px; margin:auto; box-shadow:0 10px 30px rgba(0,0,0,0.5);">
                    <h2 style="text-align:center; margin-bottom:15px; font-size:1.3rem; color:#fff;">${title}</h2>
                    ${thumb ? `<div style="margin-bottom:15px; position:relative;"><img src="${thumb}" alt="Thumbnail" style="width:100%; border-radius:18px; object-fit:cover;"/><div style="position:absolute; bottom:10px; left:10px; background:#ff2a75; padding:4px 12px; border-radius:20px; font-size:0.75rem; font-weight:bold;">${label}</div></div>` : ''}
                    ${photosHtml}
                    ${videosHtml}
                </div>
            `;

            const subject = encodeURIComponent(title + " [" + label + "]");
            const body = encodeURIComponent(htmlContent);
            const mailtoUrl = `mailto:${BLOGGER_EMAIL}?subject=${subject}&body=${body}`;

            window.location.href = mailtoUrl;
            alert("সফল! জিমেইল ওপেন হলে শুধু Send বাটনে প্রেস করলেই পোস্ট পাবলিশ হয়ে যাবে! 🎉");
        }
    </script>
</body>
</html>
