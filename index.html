<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiNK Hub - Viral Collection</title>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-orange: #ff6600;
            --orange-gradient: linear-gradient(180deg, #ff7a18 0%, #ff5200 100%);
            --bg-body: #f4f7fb;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-label: #e65c00;
            --border-color: #e2e8f0;
            --radius-card: 32px;
            --radius-pill: 50px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            animation: fadeInBody 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInBody {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 440px;
            border-radius: var(--radius-card);
            padding: 26px 22px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
            position: relative;
            animation: slideUpCard 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes slideUpCard {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-box {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #fff6ee;
            border: 2px solid #ffe3d1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-orange);
            font-size: 1.4rem;
            box-shadow: 0 4px 12px rgba(255, 102, 0, 0.12);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .logo-box:hover {
            transform: scale(1.08) rotate(6deg);
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-text h2 {
            font-size: 1.4rem;
            color: #0f172a;
            font-weight: 800;
            letter-spacing: -0.4px;
            line-height: 1.1;
        }

        .brand-text p {
            font-size: 0.82rem;
            color: #64748b;
            font-weight: 600;
            margin-top: 2px;
        }

        .target-icon {
            width: 42px;
            height: 42px;
            background: #ffebeb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff3b3b;
            font-size: 1.1rem;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 12px rgba(255, 59, 59, 0.2);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .target-icon:hover {
            transform: scale(1.15) rotate(15deg);
            background: #ffd6d6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .label-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        label {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--text-label);
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
        }

        .input-pill-wrapper {
            background: #ffffff;
            border: 1.5px solid #eef2f6;
            border-radius: var(--radius-pill);
            padding: 4px;
            display: flex;
            align-items: center;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.01);
            transition: border-color 0.2s;
        }

        .input-pill-wrapper:focus-within {
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 4px rgba(255, 102, 0, 0.1);
        }

        .input-icon-inside {
            color: var(--primary-orange);
            font-size: 1.1rem;
            margin-left: 14px;
            margin-right: 4px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: none;
            outline: none;
            font-size: 0.95rem;
            background: transparent;
            color: var(--text-main);
            font-weight: 500;
        }

        input::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        .btn-browse {
            background: var(--orange-gradient);
            color: white;
            border: none;
            padding: 0 22px;
            height: 44px;
            border-radius: var(--radius-pill);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(255, 102, 0, 0.3);
            transition: transform 0.15s;
        }

        .btn-browse:active {
            transform: scale(0.97);
        }

        .btn-add-light {
            background: #fff3eb;
            color: var(--primary-orange);
            border: none;
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-publish {
            width: 100%;
            background: var(--orange-gradient);
            color: white;
            border: none;
            padding: 16px;
            border-radius: var(--radius-pill);
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(255, 102, 0, 0.35);
            margin-top: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
            animation: pulseGlow 3s infinite;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 8px 24px rgba(255, 102, 0, 0.35); }
            50% { box-shadow: 0 8px 30px rgba(255, 102, 0, 0.55); }
            100% { box-shadow: 0 8px 24px rgba(255, 102, 0, 0.35); }
        }

        .btn-publish:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(255, 102, 0, 0.5);
        }

        .dynamic-field {
            margin-top: 10px;
        }

        /* Modal Popup */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: white;
            width: 90%;
            max-width: 380px;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-box h3 {
            font-size: 1.1rem;
            color: #0f172a;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .modal-box p {
            font-size: 0.82rem;
            color: #64748b;
            margin-bottom: 16px;
        }

        .modal-btns {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .btn-modal-save {
            flex: 1;
            background: var(--orange-gradient);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-modal-cancel {
            background: #f1f5f9;
            color: #64748b;
            border: none;
            padding: 12px 16px;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Header -->
        <div class="header">
            <div class="brand">
                <div class="logo-box">
                    <img src="https://archive.org/download/20261031-043559/20261031_043559.png" alt="Logo"[cite: 7] onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <i class="fa-solid fa-truck-pickup" style="display:none;"></i>
                </div>
                <div class="brand-text">
                    <h2>LiNK Hub</h2>
                    <p>Viral Collection</p>
                </div>
            </div>
            <!-- Target Icon Button for Access Token -->
            <button type="button" class="target-icon" onclick="openTokenModal()" title="Configure Access Token">
                <i class="fa-solid fa-bullseye"></i>
            </button>
        </div>

        <!-- Form -->
        <form id="postForm" onsubmit="handlePublish(event)">
            
            <!-- Post Title with Label Button on Right -->
            <div class="form-group">
                <label><i class="fa-solid fa-pen"></i> Post Title</label>
                <div class="input-pill-wrapper">
                    <input type="text" id="postTitle" placeholder="Enter post title..." required>
                    <button type="button" class="btn-browse" onclick="promptLabel()" title="Add Post Label" style="margin-right: 2px;">
                        <i class="fa-solid fa-tags"></i> Label
                    </button>
                </div>
                <!-- Hidden input to store label value -->
                <input type="hidden" id="postLabel" value="Viral">
            </div>

            <!-- Post Image -->
            <div class="form-group">
                <label><i class="fa-regular fa-image"></i> Post Image</label>
                <div class="input-pill-wrapper">
                    <i class="fa-solid fa-cloud-arrow-up input-icon-inside"></i>
                    <input type="text" id="thumbnailUrl" placeholder="Select post image...">
                    <button type="button" class="btn-browse" onclick="triggerFileInput('thumbnailUrl')">Browse</button>
                </div>
            </div>

            <!-- Photos -->
            <div class="form-group">
                <div class="label-container">
                    <label><i class="fa-regular fa-images"></i> Photos</label>
                    <button type="button" class="btn-add-light" onclick="addNewField('additionalPhotosContainer', 'photo')">+ Add Photo</button>
                </div>
                <div id="additionalPhotosContainer">
                    <div class="input-pill-wrapper dynamic-field">
                        <i class="fa-regular fa-image input-icon-inside"></i>
                        <input type="text" class="additional-photo-input" placeholder="Select extra photo...">
                        <button type="button" class="btn-browse" onclick="triggerDynamicFileInput(this)">Browse</button>
                    </div>
                </div>
            </div>

            <!-- Video -->
            <div class="form-group">
                <div class="label-container">
                    <label><i class="fa-solid fa-video"></i> Video</label>
                    <button type="button" class="btn-add-light" onclick="addNewField('videoStreamsContainer', 'video')">+ Add Video</button>
                </div>
                <div id="videoStreamsContainer">
                    <div class="input-pill-wrapper dynamic-field">
                        <i class="fa-solid fa-video input-icon-inside"></i>
                        <input type="text" class="video-stream-input" placeholder="Select video stream...">
                        <button type="button" class="btn-browse" onclick="triggerDynamicFileInput(this)">Browse</button>
                    </div>
                </div>
            </div>

            <!-- Publish Button -->
            <button type="submit" class="btn-publish" id="publishBtn">
                Publish to LiNK Hub <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </div>

    <!-- Token Settings Modal -->
    <div class="modal-overlay" id="tokenModal">
        <div class="modal-box">
            <h3>Blogger Access Token</h3>
            <p>আপনার OAuth Access Token এখানে পেস্ট করে সেভ করুন।</p>
            <div class="input-pill-wrapper">
                <input type="password" id="tokenInput" placeholder="Paste access token here...">
            </div>
            <div class="modal-btns">
                <button type="button" class="btn-modal-cancel" onclick="closeTokenModal()">Cancel</button>
                <button type="button" class="btn-modal-save" onclick="saveToken()">Save Token</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Backend API Execution -->
    <script>
        const BLOG_ID = "4933392428309988074";

        if(!localStorage.getItem('blogger_access_token')) {
            localStorage.setItem('blogger_access_token', 'ya29.a0AehfTOkV2FUZ9Chi7XcdjEh01TnFMX0DDnVTWZsOCJHvFtEEJaaXUa-He7xoE95wPcTJsE618qE6a9YfovVE7q0KPTCbEGUaseMvheVfih03etB8sc0ZRypwc_by11Q4a45jB9ITKlER2r6CKJoDdUrQEEiehHVp67-mxbzORw1i1tcNRUdpQe6TCFAoOwAbjBed_5YaCgYKARoSARESFQHGX2Mip6fbxQ7nA8cl04GJ0A1YWg0206');
        }

        function openTokenModal() {
            const savedToken = localStorage.getItem('blogger_access_token') || '';
            document.getElementById('tokenInput').value = savedToken;
            document.getElementById('tokenModal').classList.add('active');
        }

        function closeTokenModal() {
            document.getElementById('tokenModal').classList.remove('active');
        }

        function saveToken() {
            const tokenValue = document.getElementById('tokenInput').value.trim();
            if(tokenValue) {
                localStorage.setItem('blogger_access_token', tokenValue);
                alert("Access Token সফলভাবে সেভ হয়েছে! 🎉");
                closeTokenModal();
            } else {
                alert("দয়া করে একটি ভ্যালিড টোকেন দিন।");
            }
        }

        function promptLabel() {
            const currentLabel = document.getElementById('postLabel').value;
            const newLabel = prompt("পোস্টের জন্য লেবেল বা ক্যাটাগরি লিখুন (কমা দিয়ে একাধিক দিতে পারেন):", currentLabel);
            if(newLabel !== null) {
                document.getElementById('postLabel').value = newLabel.trim();
                alert("লেবেল সেট করা হয়েছে: " + newLabel);
            }
        }

        function triggerFileInput(targetElementId) {
            const hiddenFileInput = document.createElement('input');
            hiddenFileInput.type = 'file';
            hiddenFileInput.accept = 'image/*,video/*';
            hiddenFileInput.onchange = function(e) {
                const selectedFile = e.target.files[0];
                if (selectedFile) {
                    document.getElementById(targetElementId).value = selectedFile.name;
                }
            };
            hiddenFileInput.click();
        }

        function triggerDynamicFileInput(buttonElement) {
            const textInputField = buttonElement.previousElementSibling;
            const hiddenFileInput = document.createElement('input');
            hiddenFileInput.type = 'file';
            hiddenFileInput.accept = 'image/*,video/*';
            hiddenFileInput.onchange = function(e) {
                const selectedFile = e.target.files[0];
                if (selectedFile) {
                    textInputField.value = selectedFile.name;
                }
            };
            hiddenFileInput.click();
        }

        function addNewField(containerWrapperId, fieldCategory) {
            const containerBox = document.getElementById(containerWrapperId);
            const wrapperDiv = document.createElement('div');
            wrapperDiv.className = 'input-pill-wrapper dynamic-field';
            
            const iconClass = fieldCategory === 'photo' ? 'fa-regular fa-image' : 'fa-solid fa-video';
            const inputPlaceholderText = fieldCategory === 'photo' ? 'Select extra photo...' : 'Select video stream...';
            const specificInputClassName = fieldCategory === 'photo' ? 'additional-photo-input' : 'video-stream-input';

            wrapperDiv.innerHTML = `
                <i class="${iconClass} input-icon-inside"></i>
                <input type="text" class="${specificInputClassName}" placeholder="${inputPlaceholderText}">
                <button type="button" class="btn-browse" onclick="triggerDynamicFileInput(this)">Browse</button>
            `;
            containerBox.appendChild(wrapperDiv);
        }

        async function handlePublish(submissionEvent) {
            submissionEvent.preventDefault();

            const ACCESS_TOKEN = localStorage.getItem('blogger_access_token');
            if(!ACCESS_TOKEN) {
                alert("দয়া করে ওপরের ডানপাশের 🎯 (Target) আইকনে ক্লিক করে আপনার Blogger Access Token সেট করে নিন!");
                openTokenModal();
                return;
            }

            const postTitleText = document.getElementById('postTitle').value.trim();
            const postLabelsValue = document.getElementById('postLabel').value.split(',').map(l => l.trim()).filter(l => l);
            const thumbnailSource = document.getElementById('thumbnailUrl').value.trim();

            const extraPhotoInputsList = document.querySelectorAll('.additional-photo-input');
            let collectedPhotosHtmlCode = '';
            extraPhotoInputsList.forEach(function(field) {
                if (field.value.trim() !== '') {
                    collectedPhotosHtmlCode += `<p><img src="${field.value}" alt="Extra Image" style="max-width:100%; border-radius:12px; margin-bottom:10px;"/></p>`;
                }
            });

            const extraVideoInputsList = document.querySelectorAll('.video-stream-input');
            let collectedVideosHtmlCode = '';
            extraVideoInputsList.forEach(function(field) {
                if (field.value.trim() !== '') {
                    collectedVideosHtmlCode += `<p><strong>Video Stream:</strong> ${field.value}</p>`;
                }
            });

            const finalPostContentHtml = `
                <div class="viral-post-body">
                    ${thumbnailSource ? `<p><img src="${thumbnailSource}" alt="Thumbnail" style="max-width:100%; border-radius:12px; margin-bottom:15px;"/></p>` : ''}
                    ${collectedPhotosHtmlCode}
                    ${collectedVideosHtmlCode}
                </div>
            `;

            const publishButtonElement = document.getElementById('publishBtn');
            publishButtonElement.disabled = true;
            publishButtonElement.innerHTML = `Publishing... <i class="fa-solid fa-spinner fa-spin"></i>`;

            try {
                const response = await fetch(`https://www.googleapis.com/blogger/v3/blogs/${BLOG_ID}/posts/`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${ACCESS_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: postTitleText,
                        content: finalPostContentHtml,
                        labels: postLabelsValue
                    })
                });

                const responseJsonData = await response.json();

                if (responseJsonData.id) {
                    alert("অভিনন্দন! সফলভাবে আপনার LiNK Hub সাইটে পোস্ট পাবলিশ হয়েছে! 🎉");
                    document.getElementById('postForm').reset();
                } else {
                    alert("পোস্ট পাবলিশ করতে সমস্যা হয়েছে: " + (responseJsonData.error?.message || "টোকেনটি মেয়াদোত্তীর্ণ হতে পারে।"));
                }
            } catch (networkError) {
                alert("নেটওয়ার্ক সংযোগে সমস্যা হয়েছে!");
            } finally {
                publishButtonElement.disabled = false;
                publishButtonElement.innerHTML = `Publish to LiNK Hub <i class="fa-solid fa-paper-plane"></i>`;
            }
        }
    </script>
</body>
</html>
