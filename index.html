<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiNK Hub - Viral Collection</title>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-orange: #ff6b00;
            --primary-gradient: linear-gradient(135deg, #ff6b00, #ff4500);
            --bg-body: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #777777;
            --border-color: #eee;
            --radius-main: 32px;
            --radius-btn: 24px;
            --radius-input: 22px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            animation: fadeInBody 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInBody {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            border-radius: var(--radius-main);
            padding: 28px 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            animation: slideUpCard 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .card:hover {
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.09);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 26px;
            animation: fadeInItem 0.5s ease 0.1s both;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffe8d6;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .logo:hover {
            transform: scale(1.08) rotate(5deg);
        }

        .brand-text h2 {
            font-size: 1.35rem;
            color: var(--text-main);
            font-weight: 800;
            letter-spacing: -0.5px;
            transition: color 0.3s ease;
        }

        .brand-text h2:hover {
            color: var(--primary-orange);
        }

        .brand-text p {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .target-icon {
            width: 40px;
            height: 40px;
            background: #fff0f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff4747;
            font-size: 1.1rem;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s ease;
        }

        .target-icon:hover {
            transform: scale(1.15) rotate(15deg);
            background: #ffe0e0;
        }

        .form-group {
            margin-bottom: 20px;
            animation: fadeInItem 0.5s ease both;
        }

        .form-group:nth-child(1) { animation-delay: 0.15s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }
        .form-group:nth-child(3) { animation-delay: 0.25s; }
        .form-group:nth-child(4) { animation-delay: 0.3s; }

        @keyframes fadeInItem {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .label-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        label {
            font-size: 0.75rem;
            font-weight: 800;
            color: #555;
            letter-spacing: 0.7px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.25s ease;
        }

        label:hover {
            color: var(--primary-orange);
        }

        label i {
            color: var(--primary-orange);
            font-size: 0.85rem;
            transition: transform 0.3s ease;
        }

        label:hover i {
            transform: scale(1.2);
        }

        .file-input-wrapper {
            display: flex;
            gap: 10px;
            width: 100%;
            align-items: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px 18px;
            border-radius: var(--radius-input);
            border: 1.5px solid var(--border-color);
            outline: none;
            font-size: 0.95rem;
            background: #fafbfc;
            color: var(--text-main);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input[type="text"]:focus {
            border-color: var(--primary-orange);
            background: #ffffff;
            box-shadow: 0 0 0 5px rgba(255, 107, 0, 0.1);
            transform: translateY(-1px);
        }

        .btn-browse {
            background: var(--primary-orange);
            color: white;
            border: none;
            padding: 0 20px;
            height: 50px;
            border-radius: 18px;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(255, 107, 0, 0.25);
        }

        .btn-browse:hover {
            background: #e05e00;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(255, 107, 0, 0.35);
        }

        .btn-browse:active {
            transform: translateY(0);
            box-shadow: 0 2px 6px rgba(255, 107, 0, 0.2);
        }

        .btn-add-light {
            background: #fff3eb;
            color: var(--primary-orange);
            border: 1px solid #ffd8c2;
            padding: 6px 14px;
            border-radius: 14px;
            font-size: 0.76rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-add-light:hover {
            background: var(--primary-orange);
            color: #ffffff;
            border-color: var(--primary-orange);
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(255, 107, 0, 0.25);
        }

        .btn-add-light:active {
            transform: translateY(0);
        }

        .btn-publish {
            width: 100%;
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 17px;
            border-radius: var(--radius-btn);
            font-size: 1.08rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(255, 107, 0, 0.35);
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: pulseGlow 3s infinite;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 8px 22px rgba(255, 107, 0, 0.35); }
            50% { box-shadow: 0 8px 28px rgba(255, 107, 0, 0.55); }
            100% { box-shadow: 0 8px 22px rgba(255, 107, 0, 0.35); }
        }

        .btn-publish:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(255, 107, 0, 0.5);
        }

        .btn-publish:active {
            transform: translateY(0);
            box-shadow: 0 4px 12px rgba(255, 107, 0, 0.3);
        }

        .token-alert {
            background: #ffebe9;
            color: #ff4d4f;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 0.86rem;
            font-weight: 700;
            text-align: center;
            margin-top: 18px;
            border: 1px solid #ffccc7;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            animation: shakeAlert 0.5s ease-in-out;
        }

        @keyframes shakeAlert {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }

        .dynamic-field {
            margin-top: 10px;
            animation: expandField 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform-origin: top;
        }

        @keyframes expandField {
            from { opacity: 0; transform: scaleY(0.8) translateY(-8px); }
            to { opacity: 1; transform: scaleY(1) translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Header Section -->
        <div class="header">
            <div class="brand">
                <img src="https://i.postimg.co/g2T5B16V/logo.png" alt="LiNK Hub Logo" class="logo" onerror="this.src='https://via.placeholder.com/50'">
                <div class="brand-text">
                    <h2>LiNK Hub</h2>
                    <p>Viral Collection</p>
                </div>
            </div>
            <div class="target-icon">
                <i class="fa-solid fa-bullseye"></i>
            </div>
        </div>

        <!-- Main Submission Form -->
        <form id="postForm" onsubmit="handlePublish(event)">
            
            <!-- Post Title Field -->
            <div class="form-group">
                <label><i class="fa-solid fa-font"></i> POST TITLE</label>
                <input type="text" id="postTitle" placeholder="Enter post title..." required>
            </div>

            <!-- Thumbnail Image Field -->
            <div class="form-group">
                <label><i class="fa-regular fa-image"></i> THUMBNAIL IMAGE</label>
                <div class="file-input-wrapper">
                    <input type="text" id="thumbnailUrl" placeholder="Select thumbnail image...">
                    <button type="button" class="btn-browse" onclick="triggerFileInput('thumbnailUrl')">Browse</button>
                </div>
            </div>

            <!-- Additional Photos Container -->
            <div class="form-group">
                <div class="label-container">
                    <label><i class="fa-solid fa-images"></i> ADDITIONAL PHOTOS</label>
                    <button type="button" class="btn-add-light" onclick="addNewField('additionalPhotosContainer', 'photo')">+ Add Photo</button>
                </div>
                <div id="additionalPhotosContainer">
                    <div class="file-input-wrapper dynamic-field" style="animation-delay: 0.05s; opacity: 1;">
                        <input type="text" class="additional-photo-input" placeholder="Select extra photo...">
                        <button type="button" class="btn-browse" onclick="triggerDynamicFileInput(this)">Browse</button>
                    </div>
                </div>
            </div>

            <!-- Video Streams Container -->
            <div class="form-group">
                <div class="label-container">
                    <label><i class="fa-solid fa-video"></i> VIDEO STREAMS</label>
                    <button type="button" class="btn-add-light" onclick="addNewField('videoStreamsContainer', 'video')">+ Add Video</button>
                </div>
                <div id="videoStreamsContainer">
                    <div class="file-input-wrapper dynamic-field" style="animation-delay: 0.05s; opacity: 1;">
                        <input type="text" class="video-stream-input" placeholder="Select video stream...">
                        <button type="button" class="btn-browse" onclick="triggerDynamicFileInput(this)">Browse</button>
                    </div>
                </div>
            </div>

            <!-- Publish Action Button -->
            <button type="submit" class="btn-publish" id="publishBtn">
                Publish to Blogger <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>

        <!-- Access Token Status Check -->
        <div id="tokenStatus"></div>
    </div>

    <!-- JavaScript Core Logic -->
    <script>
        // =========================================================================
        // আপনার কনফিগারেশন টোকেন এবং ব্লগ আইডি এখানে সেট করা আছে
        // =========================================================================
        const BLOGGER_ACCESS_TOKEN = "KIeHeeXhVhgCJax9xMyk485anVSVViT1";
        const BLOG_ID = "4933392428309988074";

        window.addEventListener('DOMContentLoaded', function() {
            verifyAccessToken();
        });

        function verifyAccessToken() {
            const statusContainer = document.getElementById('tokenStatus');
            if (!BLOGGER_ACCESS_TOKEN || BLOGGER_ACCESS_TOKEN.includes("YOUR_ACCESS_TOKEN") || BLOGGER_ACCESS_TOKEN.trim() === "") {
                statusContainer.innerHTML = `<div class="token-alert"><i class="fa-solid fa-triangle-exclamation"></i> কোডের ভেতরে আপনার Access Token বসানো হয়নি!</div>`;
                return false;
            } else {
                statusContainer.innerHTML = '';
                return true;
            }
        }

        function triggerFileInput(targetElementId) {
            const hiddenFileInput = document.createElement('input');
            hiddenFileInput.type = 'file';
            hiddenFileInput.accept = 'image/*,video/*';
            hiddenFileInput.onchange = function(e) {
                const selectedFile = e.target.files[0];
                if (selectedFile) {
                    document.getElementById(targetElementId).value = selectedFile.name;
                }
            };
            hiddenFileInput.click();
        }

        function triggerDynamicFileInput(buttonElement) {
            const textInputField = buttonElement.previousElementSibling;
            const hiddenFileInput = document.createElement('input');
            hiddenFileInput.type = 'file';
            hiddenFileInput.accept = 'image/*,video/*';
            hiddenFileInput.onchange = function(e) {
                const selectedFile = e.target.files[0];
                if (selectedFile) {
                    textInputField.value = selectedFile.name;
                }
            };
            hiddenFileInput.click();
        }

        function addNewField(containerWrapperId, fieldCategory) {
            const containerBox = document.getElementById(containerWrapperId);
            const wrapperDiv = document.createElement('div');
            wrapperDiv.className = 'file-input-wrapper dynamic-field';
            
            const inputPlaceholderText = fieldCategory === 'photo' ? 'Select extra photo...' : 'Select video stream...';
            const specificInputClassName = fieldCategory === 'photo' ? 'additional-photo-input' : 'video-stream-input';

            wrapperDiv.innerHTML = `
                <input type="text" class="${specificInputClassName}" placeholder="${inputPlaceholderText}">
                <button type="button" class="btn-browse" onclick="triggerDynamicFileInput(this)">Browse</button>
            `;
            containerBox.appendChild(wrapperDiv);
        }

        async function handlePublish(submissionEvent) {
            submissionEvent.preventDefault();

            if (!verifyAccessToken()) {
                alert("দয়া করে কোডের ভেতরে আপনার সঠিক Access Token বসিয়ে নিন!");
                return;
            }

            const postTitleText = document.getElementById('postTitle').value.trim();
            const thumbnailSource = document.getElementById('thumbnailUrl').value.trim();

            const extraPhotoInputsList = document.querySelectorAll('.additional-photo-input');
            let collectedPhotosHtmlCode = '';
            extraPhotoInputsList.forEach(function(field) {
                if (field.value.trim() !== '') {
                    collectedPhotosHtmlCode += `<p><img src="${field.value}" alt="Extra Image" style="max-width:100%; border-radius:12px; margin-bottom:10px;"/></p>`;
                }
            });

            const extraVideoInputsList = document.querySelectorAll('.video-stream-input');
            let collectedVideosHtmlCode = '';
            extraVideoInputsList.forEach(function(field) {
                if (field.value.trim() !== '') {
                    collectedVideosHtmlCode += `<p><strong>Video Stream:</strong> ${field.value}</p>`;
                }
            });

            const finalPostContentHtml = `
                <div class="viral-post-body">
                    ${thumbnailSource ? `<p><img src="${thumbnailSource}" alt="Thumbnail" style="max-width:100%; border-radius:12px; margin-bottom:15px;"/></p>` : ''}
                    ${collectedPhotosHtmlCode}
                    ${collectedVideosHtmlCode}
                </div>
            `;

            const publishButtonElement = document.getElementById('publishBtn');
            publishButtonElement.disabled = true;
            publishButtonElement.innerHTML = `Publishing... <i class="fa-solid fa-spinner fa-spin"></i>`;

            try {
                const response = await fetch(`https://www.googleapis.com/blogger/v3/blogs/${BLOG_ID}/posts/`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${BLOGGER_ACCESS_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: postTitleText,
                        content: finalPostContentHtml
                    })
                });

                const responseJsonData = await response.json();

                if (responseJsonData.id) {
                    alert("অভিনন্দন! সফলভাবে আপনার ব্লগার সাইটে পোস্ট পাবলিশ হয়েছে! 🎉");
                    document.getElementById('postForm').reset();
                } else {
                    alert("পোস্ট পাবলিশ করতে ব্যর্থ হয়েছে। দয়া করে আপনার Access Token চেক করুন।");
                }
            } catch (networkError) {
                alert("নেটওয়ার্ক সংযোগে সমস্যা হয়েছে!");
            } finally {
                publishButtonElement.disabled = false;
                publishButtonElement.innerHTML = `Publish to Blogger <i class="fa-solid fa-paper-plane"></i>`;
            }
        }
    </script>
</body>
</html>
