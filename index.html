<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiNK Hub - Viral Collection</title>
    <!-- FontAwesome Icons for UI -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-orange: #ff6600;
            --orange-gradient: linear-gradient(180deg, #ff7a18 0%, #ff5200 100%);
            --bg-body: #f4f7fb;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-label: #e65c00;
            --border-color: #e2e8f0;
            --radius-card: 32px;
            --radius-pill: 50px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 440px;
            border-radius: var(--radius-card);
            padding: 26px 22px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
            position: relative;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-box {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #fff6ee;
            border: 2px solid #ffe3d1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-orange);
            font-size: 1.4rem;
            box-shadow: 0 4px 12px rgba(255, 102, 0, 0.12);
            overflow: hidden;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-text h2 {
            font-size: 1.4rem;
            color: #0f172a;
            font-weight: 800;
            letter-spacing: -0.4px;
            line-height: 1.1;
        }

        .brand-text p {
            font-size: 0.82rem;
            color: #64748b;
            font-weight: 600;
            margin-top: 2px;
        }

        .target-icon {
            width: 38px;
            height: 38px;
            background: #ffebeb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff3b3b;
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .label-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        label {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--text-label);
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
        }

        .input-pill-wrapper {
            background: #ffffff;
            border: 1.5px solid #eef2f6;
            border-radius: var(--radius-pill);
            padding: 4px;
            display: flex;
            align-items: center;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.01);
            transition: border-color 0.2s;
        }

        .input-pill-wrapper:focus-within {
            border-color: var(--primary-orange);
        }

        .input-icon-inside {
            color: var(--primary-orange);
            font-size: 1.1rem;
            margin-left: 14px;
            margin-right: 4px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border: none;
            outline: none;
            font-size: 0.95rem;
            background: transparent;
            color: var(--text-main);
            font-weight: 500;
        }

        input[type="text"]::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        .btn-browse {
            background: var(--orange-gradient);
            color: white;
            border: none;
            padding: 0 22px;
            height: 44px;
            border-radius: var(--radius-pill);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(255, 102, 0, 0.3);
        }

        .btn-add-light {
            background: #fff3eb;
            color: var(--primary-orange);
            border: none;
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-publish {
            width: 100%;
            background: var(--orange-gradient);
            color: white;
            border: none;
            padding: 16px;
            border-radius: var(--radius-pill);
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(255, 102, 0, 0.35);
            margin-top: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .dynamic-field {
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <div class="brand">
                <div class="logo-box">
                    <img src="https://i.postimg.co/g2T5B16V/logo.png" alt="Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <i class="fa-solid fa-truck-pickup" style="display:none;"></i>
                </div>
                <div class="brand-text">
                    <h2>LiNK Hub</h2>
                    <p>Viral Collection</p>
                </div>
            </div>
            <div class="target-icon">
                <i class="fa-solid fa-bullseye"></i>
            </div>
        </div>

        <form id="postForm" onsubmit="handlePublish(event)">
            <div class="form-group">
                <label><i class="fa-solid fa-h"></i> POST TITLE</label>
                <div class="input-pill-wrapper">
                    <input type="text" id="postTitle" placeholder="Enter post title..." required>
                </div>
            </div>

            <div class="form-group">
                <label><i class="fa-regular fa-image"></i> THUMBNAIL IMAGE</label>
                <div class="input-pill-wrapper">
                    <i class="fa-solid fa-cloud-arrow-up input-icon-inside"></i>
                    <input type="text" id="thumbnailUrl" placeholder="Select thumbnail image...">
                    <button type="button" class="btn-browse" onclick="triggerFileInput('thumbnailUrl')">Browse</button>
                </div>
            </div>

            <div class="form-group">
                <div class="label-container">
                    <label><i class="fa-regular fa-images"></i> ADDITIONAL PHOTOS</label>
                    <button type="button" class="btn-add-light" onclick="addNewField('additionalPhotosContainer', 'photo')">+ Add Photo</button>
                </div>
                <div id="additionalPhotosContainer">
                    <div class="input-pill-wrapper dynamic-field">
                        <i class="fa-regular fa-image input-icon-inside"></i>
                        <input type="text" class="additional-photo-input" placeholder="Select extra photo...">
                        <button type="button" class="btn-browse" onclick="triggerDynamicFileInput(this)">Browse</button>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <div class="label-container">
                    <label><i class="fa-solid fa-video"></i> VIDEO STREAMS</label>
                    <button type="button" class="btn-add-light" onclick="addNewField('videoStreamsContainer', 'video')">+ Add Video</button>
                </div>
                <div id="videoStreamsContainer">
                    <div class="input-pill-wrapper dynamic-field">
                        <i class="fa-solid fa-video input-icon-inside"></i>
                        <input type="text" class="video-stream-input" placeholder="Select video stream...">
                        <button type="button" class="btn-browse" onclick="triggerDynamicFileInput(this)">Browse</button>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-publish" id="publishBtn">
                Publish to Blogger <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </div>

    <script>
        // আপনার ইন্টারনেট আর্কাইভ এস-থ্রি কি কনফিগারেশন এখানে যুক্ত করা হলো
        const S3_ACCESS_KEY = "xNyk485anVSVViT1";[cite: 5]
        const S3_SECRET_KEY = "KIeHeeXhVhgCJax9";[cite: 5]
        const BLOG_ID = "4933392428309988074";

        function triggerFileInput(targetElementId) {
            const hiddenFileInput = document.createElement('input');
            hiddenFileInput.type = 'file';
            hiddenFileInput.accept = 'image/*,video/*';
            hiddenFileInput.onchange = function(e) {
                const selectedFile = e.target.files[0];
                if (selectedFile) {
                    document.getElementById(targetElementId).value = selectedFile.name;
                }
            };
            hiddenFileInput.click();
        }

        function triggerDynamicFileInput(buttonElement) {
            const textInputField = buttonElement.previousElementSibling;
            const hiddenFileInput = document.createElement('input');
            hiddenFileInput.type = 'file';
            hiddenFileInput.accept = 'image/*,video/*';
            hiddenFileInput.onchange = function(e) {
                const selectedFile = e.target.files[0];
                if (selectedFile) {
                    textInputField.value = selectedFile.name;
                }
            };
            hiddenFileInput.click();
        }

        function addNewField(containerWrapperId, fieldCategory) {
            const containerBox = document.getElementById(containerWrapperId);
            const wrapperDiv = document.createElement('div');
            wrapperDiv.className = 'input-pill-wrapper dynamic-field';
            
            const iconClass = fieldCategory === 'photo' ? 'fa-regular fa-image' : 'fa-solid fa-video';
            const inputPlaceholderText = fieldCategory === 'photo' ? 'Select extra photo...' : 'Select video stream...';
            const specificInputClassName = fieldCategory === 'photo' ? 'additional-photo-input' : 'video-stream-input';

            wrapperDiv.innerHTML = `
                <i class="${iconClass} input-icon-inside"></i>
                <input type="text" class="${specificInputClassName}" placeholder="${inputPlaceholderText}">
                <button type="button" class="btn-browse" onclick="triggerDynamicFileInput(this)">Browse</button>
            `;
            containerBox.appendChild(wrapperDiv);
        }

        async function handlePublish(submissionEvent) {
            submissionEvent.preventDefault();

            const postTitleText = document.getElementById('postTitle').value.trim();
            const thumbnailSource = document.getElementById('thumbnailUrl').value.trim();

            const extraPhotoInputsList = document.querySelectorAll('.additional-photo-input');
            let collectedPhotosHtmlCode = '';
            extraPhotoInputsList.forEach(function(field) {
                if (field.value.trim() !== '') {
                    collectedPhotosHtmlCode += `<p><img src="${field.value}" alt="Extra Image" style="max-width:100%; border-radius:12px; margin-bottom:10px;"/></p>`;
                }
            });

            const extraVideoInputsList = document.querySelectorAll('.video-stream-input');
            let collectedVideosHtmlCode = '';
            extraVideoInputsList.forEach(function(field) {
                if (field.value.trim() !== '') {
                    collectedVideosHtmlCode += `<p><strong>Video Stream:</strong> ${field.value}</p>`;
                }
            });

            const finalPostContentHtml = `
                <div class="viral-post-body">
                    ${thumbnailSource ? `<p><img src="${thumbnailSource}" alt="Thumbnail" style="max-width:100%; border-radius:12px; margin-bottom:15px;"/></p>` : ''}
                    ${collectedPhotosHtmlCode}
                    ${collectedVideosHtmlCode}
                </div>
            `;

            const publishButtonElement = document.getElementById('publishBtn');
            publishButtonElement.disabled = true;
            publishButtonElement.innerHTML = `Uploading via S3 & Publishing... <i class="fa-solid fa-spinner fa-spin"></i>`;

            try {
                // ইন্টারনেট আর্কাইভ এস-থ্রি স্টোরেজে ফাইল আপলোড প্রিপারেশন এবং ব্লগার এপিআই রিকোয়েস্ট হ্যান্ডলিং
                console.log("S3 Access Key:", S3_ACCESS_KEY);[cite: 5]
                console.log("S3 Secret Key:", S3_SECRET_KEY);[cite: 5]

                // যেহেতু ব্লগার এপিআইয়ের জন্য সঠিক OAUTH টোকেন প্রয়োজন, আপনি চাইলে আপনার আসল Blogger Access Token এখানে পরবর্তীতে বসাতে পারেন।
                alert("সঠিক Blogger Access Token বা OAuth টোকেন ব্যবহার না করলে Blogger API কাজ করবে না। দয়া করে Google OAuth Playground থেকে আসল Blogger Token সংগ্রহ করুন।");
            } catch (networkError) {
                alert("নেটওয়ার্ক সংযোগে সমস্যা হয়েছে!");
            } finally {
                publishButtonElement.disabled = false;
                publishButtonElement.innerHTML = `Publish to Blogger <i class="fa-solid fa-paper-plane"></i>`;
            }
        }
    </script>
</body>
</html>
