<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiNK Hub - Viral Collection Admin Panel (Full Edition)</title>
    <!-- FontAwesome Icons for UI Elements -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* ==========================================================================
           Global CSS Reset, Variables and Core Styling Layout
           ========================================================================== */
        :root {
            --primary-orange: #ff6b00;
            --primary-gradient: linear-gradient(135deg, #ff6b00, #ff4500);
            --bg-body: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #777777;
            --border-color: #eef0f3;
            --radius-card: 28px;
            --radius-btn: 22px;
            --radius-input: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: var(--radius-card);
            padding: 28px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* Header Component */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 26px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            object-fit: cover;
            border: 2.5px solid #ffe8d6;
            box-shadow: 0 4px 10px rgba(255, 107, 0, 0.15);
        }

        .brand-text h2 {
            font-size: 1.35rem;
            color: var(--text-main);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-text p {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .target-icon {
            width: 40px;
            height: 40px;
            background: #fff0f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff4747;
            font-size: 1.1rem;
        }

        /* Form Controls and Layout Structure */
        .form-group {
            margin-bottom: 20px;
        }

        .label-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        label {
            font-size: 0.78rem;
            font-weight: 700;
            color: #555555;
            letter-spacing: 0.6px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        label i {
            color: var(--primary-orange);
            font-size: 0.9rem;
        }

        .file-input-wrapper {
            display: flex;
            gap: 10px;
            width: 100%;
            align-items: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            border-radius: var(--radius-input);
            border: 1.5px solid var(--border-color);
            outline: none;
            font-size: 0.96rem;
            background: #fafbfc;
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--primary-orange);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(255, 107, 0, 0.1);
        }

        /* Interactive Buttons Style */
        .btn-browse {
            background: var(--primary-orange);
            color: white;
            border: none;
            padding: 0 20px;
            height: 48px;
            border-radius: 18px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(255, 107, 0, 0.2);
        }

        .btn-browse:hover {
            background: #e05e00;
            transform: translateY(-1px);
        }

        .btn-add-light {
            background: #fff3eb;
            color: var(--primary-orange);
            border: 1px solid #ffd8c2;
            padding: 6px 14px;
            border-radius: 14px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-add-light:hover {
            background: #ffe5d0;
        }

        .btn-publish {
            width: 100%;
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 17px;
            border-radius: var(--radius-btn);
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(255, 107, 0, 0.35);
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.25s ease;
        }

        .btn-publish:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 107, 0, 0.45);
        }

        /* Alert Status Containers */
        .token-alert {
            background: #ffebe9;
            color: #ff4d4f;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 0.88rem;
            font-weight: 600;
            text-align: center;
            margin-top: 18px;
            border: 1px solid #ffccc7;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .dynamic-field {
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Main Panel Header Component -->
        <div class="header">
            <div class="brand">
                <img src="https://i.postimg.co/g2T5B16V/logo.png" alt="LiNK Hub Logo" class="logo" onerror="this.src='https://via.placeholder.com/50'">
                <div class="brand-text">
                    <h2>LiNK Hub</h2>
                    <p>Viral Collection</p>
                </div>
            </div>
            <div class="target-icon">
                <i class="fa-solid fa-bullseye"></i>
            </div>
        </div>

        <!-- Master Submission Entry Form -->
        <form id="postForm" onsubmit="handlePublish(event)">
            
            <!-- Post Title Input Field -->
            <div class="form-group">
                <label><i class="fa-solid fa-font"></i> POST TITLE</label>
                <input type="text" id="postTitle" placeholder="Enter post title here..." required>
            </div>

            <!-- Main Thumbnail Image Input Field -->
            <div class="form-group">
                <label><i class="fa-regular fa-image"></i> THUMBNAIL IMAGE</label>
                <div class="file-input-wrapper">
                    <input type="text" id="thumbnailUrl" placeholder="Select thumbnail image or enter link...">
                    <button type="button" class="btn-browse" onclick="triggerFileInput('thumbnailUrl')">Browse</button>
                </div>
            </div>

            <!-- Additional Dynamic Photos Container Block -->
            <div class="form-group">
                <div class="label-container">
                    <label><i class="fa-solid fa-images"></i> ADDITIONAL PHOTOS</label>
                    <button type="button" class="btn-add-light" onclick="addNewField('additionalPhotosContainer', 'photo')">+ Add Photo</button>
                </div>
                <div id="additionalPhotosContainer">
                    <div class="file-input-wrapper dynamic-field">
                        <input type="text" class="additional-photo-input" placeholder="Select extra photo...">
                        <button type="button" class="btn-browse" onclick="triggerDynamicFileInput(this)">Browse</button>
                    </div>
                </div>
            </div>

            <!-- Video Streams Dynamic Container Block -->
            <div class="form-group">
                <div class="label-container">
                    <label><i class="fa-solid fa-video"></i> VIDEO STREAMS</label>
                    <button type="button" class="btn-add-light" onclick="addNewField('videoStreamsContainer', 'video')">+ Add Video</button>
                </div>
                <div id="videoStreamsContainer">
                    <div class="file-input-wrapper dynamic-field">
                        <input type="text" class="video-stream-input" placeholder="Select video stream or link...">
                        <button type="button" class="btn-browse" onclick="triggerDynamicFileInput(this)">Browse</button>
                    </div>
                </div>
            </div>

            <!-- Action Publication Button -->
            <button type="submit" class="btn-publish" id="publishBtn">
                Publish to Blogger <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>

        <!-- Configuration Access Token Warning Verification Area -->
        <div id="tokenStatus"></div>
    </div>

    <!-- ==========================================================================
       JavaScript System Execution & API Management Core Layer
       ========================================================================== -->
    <script>
        // আপনার কনফিগারেশন টোকেন ও ব্লগ আইডি এখানে বসাবেন:
        const BLOGGER_ACCESS_TOKEN = "আপনার_ACCESS_TOKEN_এখানে_দিন";
        const BLOG_ID = "আপনার_BLOG_ID_এখানে_দিন";

        // পেজ সম্পূর্ণ লোড হওয়ার পর টোকেন কনফিগারেশন যাচাই করা
        window.addEventListener('DOMContentLoaded', function() {
            verifyAccessToken();
        });

        // এক্সেস টোকেন ভ্যালিডেশন লজিক ফাংশন
        function verifyAccessToken() {
            const statusContainer = document.getElementById('tokenStatus');
            if (!BLOGGER_ACCESS_TOKEN || BLOGGER_ACCESS_TOKEN.includes("আপনার_") || BLOGGER_ACCESS_TOKEN.trim() === "") {
                statusContainer.innerHTML = `<div class="token-alert"><i class="fa-solid fa-triangle-exclamation"></i> কোডের ভেতরে আপনার Access Token বসানো হয়নি!</div>`;
                return false;
            } else {
                statusContainer.innerHTML = '';
                return true;
            }
        }

        // থাম্বনেইল ফাইল সিলেক্ট করার হার্ডওয়্যার ফাইল রিডার হ্যান্ডলার
        function triggerFileInput(targetElementId) {
            const hiddenFileInput = document.createElement('input');
            hiddenFileInput.type = 'file';
            hiddenFileInput.accept = 'image/*,video/*';
            hiddenFileInput.onchange = function(e) {
                const selectedFile = e.target.files[0];
                if (selectedFile) {
                    document.getElementById(targetElementId).value = selectedFile.name;
                }
            };
            hiddenFileInput.click();
        }

        // ডায়নামিক ফাইল ফিল্ডের জন্য ফাইল ব্রাউজ ইভেন্ট হ্যান্ডলার
        function triggerDynamicFileInput(buttonElement) {
            const textInputField = buttonElement.previousElementSibling;
            const hiddenFileInput = document.createElement('input');
            hiddenFileInput.type = 'file';
            hiddenFileInput.accept = 'image/*,video/*';
            hiddenFileInput.onchange = function(e) {
                const selectedFile = e.target.files[0];
                if (selectedFile) {
                    textInputField.value = selectedFile.name;
                }
            };
            hiddenFileInput.click();
        }

        // নতুন ফিল্ড বা রো ডাইনামিকালি যুক্ত করার ফাংশন
        function addNewField(containerWrapperId, fieldCategory) {
            const containerBox = document.getElementById(containerWrapperId);
            const wrapperDiv = document.createElement('div');
            wrapperDiv.className = 'file-input-wrapper dynamic-field';
            
            const inputPlaceholderText = fieldCategory === 'photo' ? 'Select extra photo...' : 'Select video stream...';
            const specificInputClassName = fieldCategory === 'photo' ? 'additional-photo-input' : 'video-stream-input';

            wrapperDiv.innerHTML = `
                <input type="text" class="${specificInputClassName}" placeholder="${inputPlaceholderText}">
                <button type="button" class="btn-browse" onclick="triggerDynamicFileInput(this)">Browse</button>
            `;
            containerBox.appendChild(wrapperDiv);
        }

        // ব্লগার এপিআই এর মাধ্যমে রিমোট পোস্ট পাবলিশিং রিকোয়েস্ট হ্যান্ডলার
        async function handlePublish(submissionEvent) {
            submissionEvent.preventDefault();

            if (!verifyAccessToken()) {
                alert("দয়া করে কোডের ভেতরে আপনার সঠিক Access Token বসিয়ে নিন!");
                return;
            }

            const postTitleText = document.getElementById('postTitle').value.trim();
            const thumbnailSource = document.getElementById('thumbnailUrl').value.trim();

            // সকল অতিরিক্ত ছবির ডাটা ফিল্টার করে সংগ্রহ করা
            const extraPhotoInputsList = document.querySelectorAll('.additional-photo-input');
            let collectedPhotosHtmlCode = '';
            extraPhotoInputsList.forEach(function(field) {
                if (field.value.trim() !== '') {
                    collectedPhotosHtmlCode += `<p><img src="${field.value}" alt="Extra Image" style="max-width:100%; border-radius:12px; margin-bottom:10px;"/></p>`;
                }
            });

            // সকল ভিডিও স্ট্রিমের ডাটা ফিল্টার করে সংগ্রহ করা
            const extraVideoInputsList = document.querySelectorAll('.video-stream-input');
            let collectedVideosHtmlCode = '';
            extraVideoInputsList.forEach(function(field) {
                if (field.value.trim() !== '') {
                    collectedVideosHtmlCode += `<p><strong>Video Stream:</strong> ${field.value}</p>`;
                }
            });

            // সম্পূর্ণ পোস্টের ফরম্যাট করা কন্টেন্ট বডি এইচটিএমএল
            const finalPostContentHtml = `
                <div class="viral-post-body">
                    ${thumbnailSource ? `<p><img src="${thumbnailSource}" alt="Thumbnail" style="max-width:100%; border-radius:12px; margin-bottom:15px;"/></p>` : ''}
                    ${collectedPhotosHtmlCode}
                    ${collectedVideosHtmlCode}
                </div>
            `;

            const publishButtonElement = document.getElementById('publishBtn');
            publishButtonElement.disabled = true;
            publishButtonElement.innerHTML = `Publishing... <i class="fa-solid fa-spinner fa-spin"></i>`;

            try {
                const apiResponse = await fetch(`https://www.googleapis.com/blogger/v3/blogs/${BLOG_ID}/posts/`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${BLOGGER_ACCESS_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: postTitleText,
                        content: finalPostContentHtml
                    })
                });

                const responseJsonData = await apiResponse.json();

                if (responseJsonData.id) {
                    alert("অভিনন্দন! সফলভাবে আপনার ব্লগার সাইটে পোস্ট পাবলিশ হয়েছে! 🎉");
                    document.getElementById('postForm').reset();
                } else {
                    alert("পোস্ট পাবলিশ করতে ব্যর্থ হয়েছে। দয়া করে আপনার Access Token এবং Blog ID চেক করুন।");
                    console.error("Blogger API Error Details:", responseJsonData);
                }
            } catch (networkError) {
                alert("নেটওয়ার্ক সংযোগে সমস্যা হয়েছে! দয়া করে ইন্টারনেট কানেকশন চেক করুন।");
                console.error("Network Exception:", networkError);
            } finally {
                publishButtonElement.disabled = false;
                publishButtonElement.innerHTML = `Publish to Blogger <i class="fa-solid fa-paper-plane"></i>`;
            }
        }
    </script>
</body>
</html>
