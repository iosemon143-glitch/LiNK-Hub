<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiNK Hub - Viral Collection Admin</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-orange: #ff5e00;
            --primary-gradient: linear-gradient(135deg, #ff6b00 0%, #ff3700 100%);
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --radius-main: 28px;
            --radius-inner: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            animation: fadeInBody 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInBody {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 460px;
            border-radius: var(--radius-main);
            padding: 28px 22px;
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.1), 0 0 0 1px rgba(0, 0, 0, 0.03);
            animation: slideUpCard 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
            position: relative;
            overflow: hidden;
        }

        @keyframes slideUpCard {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: var(--primary-gradient);
        }

        /* Header UI */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            animation: fadeInItem 0.5s ease 0.1s both;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-box {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #fff3eb, #ffe0d0);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-orange);
            font-size: 1.4rem;
            box-shadow: 0 8px 16px rgba(255, 94, 0, 0.15);
            border: 2px solid #fff;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .logo-box:hover {
            transform: scale(1.08) rotate(6deg);
        }

        .brand-text h2 {
            font-size: 1.3rem;
            color: var(--text-main);
            font-weight: 800;
            letter-spacing: -0.4px;
        }

        .brand-text p {
            font-size: 0.78rem;
            color: var(--text-sub);
            font-weight: 600;
            margin-top: 2px;
        }

        .target-icon {
            width: 40px;
            height: 40px;
            background: #fff5f2;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff4747;
            font-size: 1.1rem;
            border: 1px solid #ffdcd6;
            transition: transform 0.3s ease;
        }

        .target-icon:hover {
            transform: scale(1.15) rotate(15deg);
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 18px;
            animation: fadeInItem 0.5s ease both;
        }

        .form-group:nth-child(1) { animation-delay: 0.15s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }
        .form-group:nth-child(3) { animation-delay: 0.25s; }
        .form-group:nth-child(4) { animation-delay: 0.3s; }

        @keyframes fadeInItem {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .label-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        label {
            font-size: 0.73rem;
            font-weight: 800;
            color: #475569;
            letter-spacing: 0.7px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            transition: color 0.2s ease;
        }

        label:hover {
            color: var(--primary-orange);
        }

        label i {
            color: var(--primary-orange);
            font-size: 0.85rem;
            transition: transform 0.3s ease;
        }

        label:hover i {
            transform: scale(1.2);
        }

        .file-input-wrapper {
            display: flex;
            gap: 10px;
            width: 100%;
            align-items: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border-radius: var(--radius-inner);
            border: 1.5px solid var(--border-color);
            outline: none;
            font-size: 0.93rem;
            font-weight: 500;
            background: #f8fafc;
            color: var(--text-main);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input[type="text"]:focus {
            border-color: var(--primary-orange);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(255, 94, 0, 0.12);
            transform: translateY(-1px);
        }

        /* Buttons Styling with Smooth Animation */
        .btn-browse {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 0 18px;
            height: 48px;
            border-radius: var(--radius-inner);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(255, 94, 0, 0.25);
        }

        .btn-browse:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(255, 94, 0, 0.35);
        }

        .btn-browse:active {
            transform: translateY(0);
        }

        .btn-add-light {
            background: #fff3eb;
            color: var(--primary-orange);
            border: 1px solid #ffd8c2;
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 0.74rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-add-light:hover {
            background: var(--primary-orange);
            color: #ffffff;
            border-color: var(--primary-orange);
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(255, 94, 0, 0.25);
        }

        .btn-add-light:active {
            transform: translateY(0);
        }

        .btn-publish {
            width: 100%;
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 16px;
            border-radius: var(--radius-inner);
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(255, 94, 0, 0.35);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: pulseGlow 3s infinite;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 8px 22px rgba(255, 94, 0, 0.35); }
            50% { box-shadow: 0 8px 28px rgba(255, 94, 0, 0.55); }
            100% { box-shadow: 0 8px 22px rgba(255, 94, 0, 0.35); }
        }

        .btn-publish:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(255, 94, 0, 0.5);
        }

        .btn-publish:active {
            transform: translateY(0);
        }

        .dynamic-field {
            margin-top: 10px;
            animation: expandField 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform-origin: top;
        }

        @keyframes expandField {
            from { opacity: 0; transform: scaleY(0.8) translateY(-8px); }
            to { opacity: 1; transform: scaleY(1) translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Header Component -->
        <div class="header">
            <div class="brand">
                <div class="logo-box">
                    <i class="fa-solid fa-bolt-lightning"></i>
                </div>
                <div class="brand-text">
                    <h2>LiNK Hub</h2>
                    <p>Viral Collection</p>
                </div>
            </div>
            <div class="target-icon">
                <i class="fa-solid fa-bullseye"></i>
            </div>
        </div>

        <!-- Main Form -->
        <form id="postForm" onsubmit="handlePublish(event)">
            
            <!-- Post Title -->
            <div class="form-group">
                <label><i class="fa-solid fa-pen-nib"></i> Post Title</label>
                <input type="text" id="postTitle" placeholder="Enter post title..." required>
            </div>

            <!-- Thumbnail Image -->
            <div class="form-group">
                <label><i class="fa-regular fa-image"></i> Thumbnail Image</label>
                <div class="file-input-wrapper">
                    <input type="text" id="thumbnailUrl" placeholder="Select thumbnail image...">
                    <button type="button" class="btn-browse" onclick="triggerFileInput('thumbnailUrl')">Browse</button>
                </div>
            </div>

            <!-- Additional Photos -->
            <div class="form-group">
                <div class="label-container">
                    <label><i class="fa-solid fa-images"></i> Additional Photos</label>
                    <button type="button" class="btn-add-light" onclick="addNewField('additionalPhotosContainer', 'photo')">+ Add Photo</button>
                </div>
                <div id="additionalPhotosContainer">
                    <div class="file-input-wrapper dynamic-field" style="animation-delay: 0.05s; opacity: 1;">
                        <input type="text" class="additional-photo-input" placeholder="Select extra photo...">
                        <button type="button" class="btn-browse" onclick="triggerDynamicFileInput(this)">Browse</button>
                    </div>
                </div>
            </div>

            <!-- Video Streams -->
            <div class="form-group">
                <div class="label-container">
                    <label><i class="fa-solid fa-video"></i> Video Streams</label>
                    <button type="button" class="btn-add-light" onclick="addNewField('videoStreamsContainer', 'video')">+ Add Video</button>
                </div>
                <div id="videoStreamsContainer">
                    <div class="file-input-wrapper dynamic-field" style="animation-delay: 0.05s; opacity: 1;">
                        <input type="text" class="video-stream-input" placeholder="Select video stream...">
                        <button type="button" class="btn-browse" onclick="triggerDynamicFileInput(this)">Browse</button>
                    </div>
                </div>
            </div>

            <!-- Publish Button -->
            <button type="submit" class="btn-publish" id="publishBtn">
                Publish to Blogger <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </div>

    <!-- JavaScript Execution -->
    <script>
        const BLOGGER_ACCESS_TOKEN = "KIeHeeXhVhgCJax9xMyk485anVSVViT1";
        const BLOG_ID = "4933392428309988074";

        function triggerFileInput(targetElementId) {
            const hiddenFileInput = document.createElement('input');
            hiddenFileInput.type = 'file';
            hiddenFileInput.accept = 'image/*,video/*';
            hiddenFileInput.onchange = function(e) {
                const selectedFile = e.target.files[0];
                if (selectedFile) {
                    document.getElementById(targetElementId).value = selectedFile.name;
                }
            };
            hiddenFileInput.click();
        }

        function triggerDynamicFileInput(buttonElement) {
            const textInputField = buttonElement.previousElementSibling;
            const hiddenFileInput = document.createElement('input');
            hiddenFileInput.type = 'file';
            hiddenFileInput.accept = 'image/*,video/*';
            hiddenFileInput.onchange = function(e) {
                const selectedFile = e.target.files[0];
                if (selectedFile) {
                    textInputField.value = selectedFile.name;
                }
            };
            hiddenFileInput.click();
        }

        function addNewField(containerWrapperId, fieldCategory) {
            const containerBox = document.getElementById(containerWrapperId);
            const wrapperDiv = document.createElement('div');
            wrapperDiv.className = 'file-input-wrapper dynamic-field';
            
            const inputPlaceholderText = fieldCategory === 'photo' ? 'Select extra photo...' : 'Select video stream...';
            const specificInputClassName = fieldCategory === 'photo' ? 'additional-photo-input' : 'video-stream-input';

            wrapperDiv.innerHTML = `
                <input type="text" class="${specificInputClassName}" placeholder="${inputPlaceholderText}">
                <button type="button" class="btn-browse" onclick="triggerDynamicFileInput(this)">Browse</button>
            `;
            containerBox.appendChild(wrapperDiv);
        }

        async function handlePublish(submissionEvent) {
            submissionEvent.preventDefault();

            const postTitleText = document.getElementById('postTitle').value.trim();
            const thumbnailSource = document.getElementById('thumbnailUrl').value.trim();

            const extraPhotoInputsList = document.querySelectorAll('.additional-photo-input');
            let collectedPhotosHtmlCode = '';
            extraPhotoInputsList.forEach(function(field) {
                if (field.value.trim() !== '') {
                    collectedPhotosHtmlCode += `<p><img src="${field.value}" alt="Extra Image" style="max-width:100%; border-radius:12px; margin-bottom:10px;"/></p>`;
                }
            });

            const extraVideoInputsList = document.querySelectorAll('.video-stream-input');
            let collectedVideosHtmlCode = '';
            extraVideoInputsList.forEach(function(field) {
                if (field.value.trim() !== '') {
                    collectedVideosHtmlCode += `<p><strong>Video Stream:</strong> ${field.value}</p>`;
                }
            });

            const finalPostContentHtml = `
                <div class="viral-post-body">
                    ${thumbnailSource ? `<p><img src="${thumbnailSource}" alt="Thumbnail" style="max-width:100%; border-radius:12px; margin-bottom:15px;"/></p>` : ''}
                    ${collectedPhotosHtmlCode}
                    ${collectedVideosHtmlCode}
                </div>
            `;

            const publishButtonElement = document.getElementById('publishBtn');
            publishButtonElement.disabled = true;
            publishButtonElement.innerHTML = `Publishing... <i class="fa-solid fa-spinner fa-spin"></i>`;

            try {
                const response = await fetch(`https://www.googleapis.com/blogger/v3/blogs/${BLOG_ID}/posts/`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${BLOGGER_ACCESS_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: postTitleText,
                        content: finalPostContentHtml
                    })
                });

                const responseJsonData = await response.json();

                if (responseJsonData.id) {
                    alert("অভিনন্দন! সফলভাবে আপনার ব্লগার সাইটে পোস্ট পাবলিশ হয়েছে! 🎉");
                    document.getElementById('postForm').reset();
                } else {
                    alert("পোস্ট পাবলিশ করতে ব্যর্থ হয়েছে। দয়া করে আপনার Access Token চেক করুন।");
                }
            } catch (networkError) {
                alert("নেটওয়ার্ক সংযোগে সমস্যা হয়েছে!");
            } finally {
                publishButtonElement.disabled = false;
                publishButtonElement.innerHTML = `Publish to Blogger <i class="fa-solid fa-paper-plane"></i>`;
            }
        }
    </script>
</body>
</html>
